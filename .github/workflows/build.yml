name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            python3-dev \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            build-essential \
            gettext \
            autopoint \
            rustc \
            cargo

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install \
            "Cython==0.29.34" \
            "virtualenv" \
            "legacy-cgi"

          python -m pip install --upgrade \
            "git+https://github.com/kivy/buildozer.git"

      - name: Show versions
        run: |
          python --version
          pip --version
          cython --version
          buildozer --version
          java -version

      - name: Clean previous Android build
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"
          rm -rf "bin"

      - name: Verify buildozer.spec
        run: |
          test -f buildozer.spec
          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Build APK
        run: |
          set +e

          buildozer -v android debug 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo "========================================"
          echo "BUILDOZER EXIT CODE: $STATUS"
          echo "========================================"

          echo "===== LAST 120 LOG LINES ====="
          tail -n 120 build.log

          exit $STATUS

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
