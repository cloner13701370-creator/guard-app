# Build APK

```yaml
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project
        run: |
          echo "===== PROJECT ====="
          pwd
          ls -la

          echo "===== BUILDOZER SPEC ====="
          if [ -f buildozer.spec ]; then
            cat buildozer.spec
          else
            echo "ERROR: buildozer.spec not found!"
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system packages
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            libtool \
            pkg-config \
            build-essential \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel

          python -m pip install "Cython<3"

          python -m pip install buildozer

      - name: Verify Python environment
        run: |
          echo "===== PYTHON ====="
          python --version
          pip --version

          echo "===== CYTHON ====="
          cython --version

          echo "===== BUILDOZER ====="
          buildozer --version

      - name: Clean Buildozer cache
        run: |
          rm -rf .buildozer

      - name: Initialize Buildozer
        run: |
          buildozer android debug --help

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show generated files
        if: always()
        run: |
          echo "===== BIN ====="
          if [ -d bin ]; then
            find bin -maxdepth 2 -type f -print
          else
            echo "bin directory does not exist"
          fi

          echo "===== BUILDOZER LOGS ====="
          if [ -d .buildozer ]; then
            find .buildozer -type f \( -name "*.log" -o -name "*.txt" \) | head -50
          else
            echo ".buildozer does not exist"
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
```
