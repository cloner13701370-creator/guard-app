name: Build APK

"on":
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            build-essential \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3"
          python -m pip install buildozer

      - name: Show Buildozer version
        run: |
          buildozer --version

      - name: Prepare Buildozer SDK
        run: |
          rm -rf "$HOME/.buildozer"
          rm -rf ".buildozer"

          SDK="$HOME/.buildozer/android/platform/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          cd /tmp

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O sdk-tools.zip

          unzip -q sdk-tools.zip

          mkdir -p "$SDK/cmdline-tools/latest"

          cp -r cmdline-tools/* "$SDK/cmdline-tools/latest/"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --licenses <<EOF
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF

          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

      - name: Verify AIDL
        run: |
          echo "SDK:"
          echo "$ANDROID_HOME"

          echo "Build tools:"
          ls -la "$ANDROID_HOME/build-tools"

          echo "AIDL:"
          ls -la "$ANDROID_HOME/build-tools/33.0.2/aidl"

          test -f "$ANDROID_HOME/build-tools/33.0.2/aidl"

          chmod +x "$ANDROID_HOME/build-tools/33.0.2/aidl"

          "$ANDROID_HOME/build-tools/33.0.2/aidl" 2>&1 || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
