```yaml
name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: START TEST
        run: |
          echo "================================="
          echo "GITHUB ACTION STARTED SUCCESSFULLY"
          echo "================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Commit: $GITHUB_SHA"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "===== FILES ====="
          ls -la

          echo "===== WORKFLOW DIRECTORY ====="
          ls -la .github/workflows || true

          echo "===== BUILDOZER SPEC ====="
          if [ -f buildozer.spec ]; then
            echo "buildozer.spec FOUND"
          else
            echo "buildozer.spec NOT FOUND"
          fi

          echo "===== MAIN.PY ====="
          if [ -f main.py ]; then
            echo "main.py FOUND"
          else
            echo "main.py NOT FOUND"
          fi

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3"
          python -m pip install buildozer

      - name: Check Buildozer
        run: |
          python --version
          java -version
          cython --version
          buildozer --version

      - name: Clean Buildozer
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Prepare Buildozer
        run: |
          sed -i.bak \
            "s/# *android.accept_sdk_license = False/android.accept_sdk_license = True/" \
            buildozer.spec || true

      - name: Download Android dependencies
        run: |
          buildozer android p4a -- --help

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Show APK
        if: always()
        run: |
          echo "===== APK ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
```
