```yaml
name: Build APK

"on":
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            build-essential \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          python -m pip install "Cython<3"

          python -m pip install --upgrade buildozer

      - name: Check versions
        run: |
          python --version
          java -version
          cython --version
          buildozer --version

      - name: Clean old Buildozer files
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Enable Android SDK license
        run: |
          if grep -q "^android.accept_sdk_license" buildozer.spec; then
            sed -i \
              "s/^android.accept_sdk_license.*/android.accept_sdk_license = True/" \
              buildozer.spec
          else
            printf "\nandroid.accept_sdk_license = True\n" >> buildozer.spec
          fi

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Install Android prerequisites
        run: |
          buildozer android p4a -- --help

      - name: Show Android SDK
        run: |
          echo "===== BUILDOVER SDK ====="
          find ~/.buildozer/android/platform -maxdepth 4 -type f \
            \( -name sdkmanager -o -name aidl \) -print || true

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
```
