      - name: Build APK
        run: |
          set +e

          timeout 45m buildozer -v android debug 2>&1 | tee build.log

          STATUS=${PIPESTATUS[0]}

          echo "=============================="
          echo "BUILDOZER EXIT CODE: $STATUS"
          echo "=============================="

          echo "===== LAST 100 LINES ====="
          tail -n 100 build.log

          exit $STATUS
                - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
