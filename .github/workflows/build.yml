name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Start
        run: echo "GitHub Actions started successfully"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Files in project:"
          ls -la

          echo ""
          echo "Checking buildozer.spec:"
          test -f buildozer.spec && echo "buildozer.spec FOUND" || (echo "buildozer.spec NOT FOUND" && exit 1)

          echo ""
          echo "Checking main.py:"
          test -f main.py && echo "main.py FOUND" || echo "main.py NOT FOUND"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython<3"
          python -m pip install buildozer

      - name: Check versions
        run: |
          python --version
          java -version
          cython --version
          buildozer --version

      - name: Clean Buildozer
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "Searching for APK..."
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
