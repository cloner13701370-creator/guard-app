```yaml
name: Build APK

on:
  push:
  workflow_dispatch:

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: "0"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            libltdl-dev \
            pkg-config \
            build-essential \
            cmake \
            libffi-dev \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython<3"
          python -m pip install --upgrade buildozer

      - name: Show versions
        run: |
          python --version
          java -version
          buildozer --version
          cython --version

      - name: Check project
        run: |
          test -f buildozer.spec
          echo "buildozer.spec found"

      - name: Accept Android SDK licenses
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path("buildozer.spec")
          text = p.read_text()

          lines = text.splitlines()
          found = False
          output = []

          for line in lines:
              stripped = line.strip()

              if stripped.startswith("android.accept_sdk_license"):
                  output.append("android.accept_sdk_license = True")
                  found = True
              else:
                  output.append(line)

          if not found:
              output.append("")
              output.append("[app]")
              output.append("android.accept_sdk_license = True")

          p.write_text("\n".join(output) + "\n")
          PY

          echo "===== android.accept_sdk_license ====="
          grep -n "android.accept_sdk_license" buildozer.spec || true

      - name: Remove old Android build
        run: |
          rm -rf ~/.buildozer
          rm -rf .buildozer

      - name: Download Android SDK and Build Tools
        run: |
          buildozer android p4a -- --help

      - name: Verify AIDL
        run: |
          echo "===== Searching for AIDL ====="
          find ~/.buildozer -type f -name aidl -print || true

          AIDL=$(find ~/.buildozer/android/platform/android-sdk/build-tools -type f -name aidl | sort -V | tail -n 1)

          if [ -z "$AIDL" ]; then
            echo "ERROR: AIDL was not installed."
            echo "===== BUILD-TOOLS ====="
            find ~/.buildozer/android/platform/android-sdk/build-tools -maxdepth 2 -type f -print || true
            exit 1
          fi

          echo "AIDL found at:"
          echo "$AIDL"

          chmod +x "$AIDL"

          echo "Testing AIDL:"
          "$AIDL" || test $? -eq 1

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Find APK
        if: always()
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
```
