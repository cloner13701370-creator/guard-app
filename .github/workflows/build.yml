
name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            openjdk-17-jdk \
            python3-pip \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel

          # نسخه پایدار Cython که با Buildozer/p4a سازگارتر است
          python -m pip install "Cython<3"

          python -m pip install --upgrade buildozer

      - name: Show Buildozer version
        run: |
          buildozer --version

      - name: Clean previous Buildozer files
        run: |
          rm -rf .buildozer
          rm -rf ~/.buildozer

      - name: Prepare buildozer.spec
        run: |
          test -f buildozer.spec

          echo "===== buildozer.spec ====="
          cat buildozer.spec

      - name: Build APK
        env:
          CI: "1"
        run: |
          yes | buildozer android debug

      - name: Verify APK
        run: |
          echo "===== APK FILES ====="
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: guard-app-apk
          path: bin/*.apk
          if-no-files-found: error
```
